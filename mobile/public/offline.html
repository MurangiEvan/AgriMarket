<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#183f32" />
    <title>AgriMarket is offline</title>
    <style>
      :root { color-scheme: light; font-family: Georgia, serif; background: #f3f5ed; color: #183f32; }
      body { display: grid; min-height: 100vh; margin: 0; place-items: center; }
      main { box-sizing: border-box; width: min(100% - 40px, 520px); padding: 36px 0; }
      h1 { max-width: 12ch; margin: 0 0 12px; font-size: 36px; line-height: 1.08; }
      p { max-width: 42ch; color: #4d6256; font: 16px/1.6 system-ui, sans-serif; }
      a { display: inline-block; margin-top: 12px; color: #183f32; font: 600 15px system-ui, sans-serif; }
      :focus-visible { outline: 3px solid #c47c37; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline for now.</h1>
      <p>Public information may be unavailable while your connection is down. Reconnect to search suppliers or send an enquiry.</p>
      <a href="/">Try AgriMarket again</a>
    </main>
  </body>
</html>
